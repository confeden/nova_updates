name: Proton feed

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: proton-feed

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generate feed
        run: python nova_android/tools/generate_feed.py --out nova_android/proton_nodes.json
      - name: Commit if changed
        run: |
          if git diff --quiet -- nova_android/proton_nodes.json; then exit 0; fi
          git config user.name 'nova-feed-bot'
          git config user.email 'nova-feed-bot@users.noreply.github.com'
          git add nova_android/proton_nodes.json
          git commit -m 'Proton feed: update'
          git push
